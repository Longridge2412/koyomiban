<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>畑のこよみ番</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #7ee787;
    --warm: #f0c040;
    --fire: #f47067;
    --water: #79c0ff;
    --earth: #d2a679;
    --air: #b8b8d0;
    --accent2: #79c0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    max-width: 720px;
    margin: 0 auto;
    line-height: 1.8;
  }

  header {
    text-align: center;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header .logo { max-width: 280px; width: 60%; height: auto; margin-bottom: 8px; }
  header h1 { font-size: 1.3em; font-weight: 400; letter-spacing: 0.2em; color: var(--accent); margin-top: 4px; }
  header .date-line { color: var(--text-dim); font-size: 0.85em; margin-top: 6px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 0.85em;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .card .explain {
    font-size: 0.92em;
    line-height: 1.9;
    color: var(--text);
  }
  .card .explain p { margin-bottom: 10px; }
  .card .explain p:last-child { margin-bottom: 0; }

  .highlight {
    background: var(--bg);
    border-radius: 8px;
    padding: 16px 18px;
    margin: 12px 0;
    font-size: 1.05em;
    line-height: 1.9;
    text-align: center;
  }

  .bd-tag {
    display: inline-block;
    padding: 2px 14px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 0.9em;
  }
  .bd-root   { background: rgba(210,166,121,0.15); color: var(--earth); border: 1px solid rgba(210,166,121,0.4); }
  .bd-leaf   { background: rgba(121,192,255,0.1);  color: var(--water); border: 1px solid rgba(121,192,255,0.35); }
  .bd-flower { background: rgba(184,184,208,0.1);  color: var(--air);   border: 1px solid rgba(184,184,208,0.35); }
  .bd-fruit  { background: rgba(244,112,103,0.1);  color: var(--fire);  border: 1px solid rgba(244,112,103,0.35); }

  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; }
  .row .label { color: var(--text-dim); font-size: 0.85em; }
  .row .val { font-size: 0.95em; }

  .moon-emoji { font-size: 2em; margin-right: 8px; vertical-align: middle; }

  .week-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85em; }
  .week-table th { color: var(--text-dim); font-weight: 400; text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  .week-table td { padding: 5px 8px; border-bottom: 1px solid rgba(48,54,61,0.4); }
  .week-table tr.today { background: rgba(126,231,135,0.07); }
  .week-table .note { color: var(--warm); font-size: 0.85em; }

  footer {
    text-align: center;
    color: rgba(139,148,158,0.5);
    font-size: 0.7em;
    padding: 20px 0;
    margin-top: 30px;
    border-top: 1px solid var(--border);
  }

  #map { height: 300px; border-radius: 8px; margin: 10px 0; }
  .terrain-info { margin-top: 12px; }
  .terrain-info .row { border-bottom: 1px solid rgba(48,54,61,0.3); }
  .terrain-loading { text-align: center; color: var(--text-dim); font-size: 0.85em; padding: 8px; }
  .frost-bar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 4px; overflow: hidden; }
  .frost-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
  .map-instructions { font-size: 0.82em; color: var(--text-dim); text-align: center; margin: 6px 0 0; }
</style>
</head>

// ===== 複数地点管理 =====
let savedLocations = [];
let activeLocationIdx = -1;

function loadLocations() {
  try {
    const raw = localStorage.getItem('koyomiban_locations');
    if (raw) savedLocations = JSON.parse(raw);
  } catch(e) {}
}
function saveLocations() {
  try { localStorage.setItem('koyomiban_locations', JSON.stringify(savedLocations)); } catch(e) {}
}
function addLocation(name, lat, lon, data) {
  // 同名があれば上書き
  const idx = savedLocations.findIndex(l => l.name === name);
  const loc = { name, lat, lon, ...data, savedAt: new Date().toISOString() };
  if (idx >= 0) savedLocations[idx] = loc;
  else savedLocations.push(loc);
  saveLocations();
  activeLocationIdx = savedLocations.findIndex(l => l.name === name);
}
function deleteLocation(name) {
  savedLocations = savedLocations.filter(l => l.name !== name);
  saveLocations();
  activeLocationIdx = -1;
}
loadLocations();

// ===== 計算関数 =====
function moonZodiac(d) {
  const e = Astronomy.EclipticGeoMoon(d);
  const s = ZODIAC[Math.floor(e.lon / 30)];
  return { lon: e.lon, sign: s };
}
function sunLon(d) { return Astronomy.SunPosition(d).elon; }
function find(arr, lon) {
  const l = ((lon % 360) + 360) % 360;
  for (let i = arr.length - 1; i >= 0; i--) { if (l >= arr[i].lon) return arr[i]; }
  return arr[arr.length - 1];
}
function moonPhase(d) {
  const a = Astronomy.MoonPhase(d);
  const age = a / (360 / 29.530588853);
  const names = [
    [22.5,'新月','🌑'],[67.5,'三日月','🌒'],[112.5,'上弦','🌓'],[157.5,'十三夜','🌔'],
    [202.5,'満月','🌕'],[247.5,'十八夜','🌖'],[292.5,'下弦','🌗'],[337.5,'二十六夜','🌘'],[360,'新月','🌑']
  ];
  const p = names.find(n => a < n[0]) || names[0];
  return { angle: a, age, name: p[1], emoji: p[2] };
}
function sunTimes(d) {
  const obs = new Astronomy.Observer(CFG.lat, CFG.lon, CFG.alt);
  const y = d.getFullYear(), m = d.getMonth(), dd = d.getDate();
  const s = new Date(Date.UTC(y, m, dd - 1, 24 - CFG.tz, 0, 0));
  const rise = Astronomy.SearchRiseSet('Sun', obs, +1, s, 1);
  const set  = Astronomy.SearchRiseSet('Sun', obs, -1, s, 1);
  if (!rise || !set) return null;
  const rJ = new Date(rise.date.getTime() + CFG.tz * 3600000);
  const sJ = new Date(set.date.getTime()  + CFG.tz * 3600000);
  return { rise: rJ, set: sJ, min: Math.round((set.date - rise.date) / 60000) };
}
function fmt(d) { return d.getUTCHours().toString().padStart(2,'0') + ':' + d.getUTCMinutes().toString().padStart(2,'0'); }

// ===== Phase 2: 地形計算 =====
const LAPSE_RATE = 0.65; // °C per 100m
const REF_ALT = 165; // 西会津アメダス観測点の標高（実測値）

async function fetchElevation(lat, lon) {
  const url = `https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lon}&lat=${lat}&outtype=JSON`;
  const res = await fetch(url);
  const data = await res.json();
  return (data.elevation !== '-----') ? parseFloat(data.elevation) : null;
}

async function fetchTerrainProfile(lat, lon) {
  // 中心点 + 周囲8点（約50m間隔）の標高を取得
  const delta = 0.0005; // 約50m（緯度方向）
  const points = [
    { key: 'nw', dlat: delta,  dlon: -delta },
    { key: 'n',  dlat: delta,  dlon: 0 },
    { key: 'ne', dlat: delta,  dlon: delta },
    { key: 'w',  dlat: 0,      dlon: -delta },
    { key: 'c',  dlat: 0,      dlon: 0 },
    { key: 'e',  dlat: 0,      dlon: delta },
    { key: 'sw', dlat: -delta, dlon: -delta },
    { key: 's',  dlat: -delta, dlon: 0 },
    { key: 'se', dlat: -delta, dlon: delta },
  ];

  const results = {};
  // 並列リクエスト
  const promises = points.map(async (p) => {
    const elev = await fetchElevation(lat + p.dlat, lon + p.dlon);
    results[p.key] = elev;
  });
  await Promise.all(promises);
  return results;
}

function calcSlope(grid) {
  // null値があれば計算不可
  for (const k of ['nw','n','ne','w','e','sw','s','se']) {
    if (grid[k] === null) return null;
  }
  const cellSize = 50;
  const dzdx = ((grid.ne + 2*grid.e + grid.se) - (grid.nw + 2*grid.w + grid.sw)) / (8*cellSize);
  const dzdy = ((grid.nw + 2*grid.n + grid.ne) - (grid.sw + 2*grid.s + grid.se)) / (8*cellSize);
  const slopePct = Math.sqrt(dzdx*dzdx + dzdy*dzdy) * 100;
  let aspect = Math.atan2(-dzdx, -dzdy) * (180/Math.PI);
  if (aspect < 0) aspect += 360;

  const dirs = [
    [337.5,360,'北'],[0,22.5,'北'],[22.5,67.5,'北東'],[67.5,112.5,'東'],
    [112.5,157.5,'南東'],[157.5,202.5,'南'],[202.5,247.5,'南西'],
    [247.5,292.5,'西'],[292.5,337.5,'北西']
  ];
  let dir = '不明';
  for (const [lo,hi,n] of dirs) { if (aspect >= lo && aspect < hi) { dir = n; break; } }

  return { slopePct: Math.round(slopePct*10)/10, aspectDeg: Math.round(aspect), direction: dir, isFlat: slopePct < 2 };
}

function calcFrostRisk(elevation, slope) {
  let score = 50;
  score += ((elevation - REF_ALT) / 100) * 5;
  const af = { '南':-15,'南東':-12,'南西':-10,'東':-5,'西':0,'北東':5,'北西':8,'北':12,'不明':0 };
  if (slope) score += (af[slope.direction] || 0);
  if (slope && slope.isFlat) score += 8;
  score = Math.max(0, Math.min(100, Math.round(score)));
  let level, desc, color;
  if (score >= 70) { level='高'; desc='霜が降りやすい環境です。霜に弱い作物は不織布やトンネルなどの対策が必要です。'; color='var(--fire)'; }
  else if (score >= 50) { level='中'; desc='霜が降りる可能性があります。春先と晩秋は天気予報と合わせて注意してください。'; color='var(--warm)'; }
  else if (score >= 30) { level='やや低'; desc='霜のリスクは比較的低いですが、放射冷却が強い晴れた夜は注意が必要です。'; color='var(--accent)'; }
  else { level='低'; desc='霜のリスクは低い環境です。南向き斜面の日当たりの恩恵があります。'; color='var(--accent)'; }
  return { score, level, desc, color };
}

function tempCorrection(elev) {
  const diff = elev - REF_ALT;
  const corr = -(diff/100) * LAPSE_RATE;
  return { diff, corr: Math.round(corr*100)/100 };
}

// ===== Phase 3: 気象データ =====
let _weatherData = null;
let _weatherError = null;

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast`
    + `?latitude=${lat}&longitude=${lon}`
    + `&hourly=temperature_2m,relative_humidity_2m,precipitation,snowfall,snow_depth,surface_pressure,wind_speed_10m,soil_temperature_0cm,shortwave_radiation`
    + `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,sunrise,sunset,wind_speed_10m_max`
    + `&timezone=Asia%2FTokyo&forecast_days=7`;
  const res = await fetch(url);
  return await res.json();
}

function calcPressureChange(pressures, windowHours) {
  if (!pressures || pressures.length < windowHours + 1) return null;
  // 現在時刻に最も近いインデックスを推定
  const now = new Date();
  const hourNow = now.getHours();
  const idx = Math.min(hourNow, pressures.length - 1);
  const idxPrev = Math.max(0, idx - windowHours);
  if (pressures[idx] == null || pressures[idxPrev] == null) return null;
  const change = Math.round((pressures[idx] - pressures[idxPrev]) * 10) / 10;
  let trend, desc;
  if (change < -3) { trend='急降下'; desc='天気が急速に崩れる可能性。強風や大雨に注意。'; }
  else if (change < -1) { trend='下降中'; desc='天気が崩れる兆し。雨の準備を。'; }
  else if (change < 1) { trend='安定'; desc='大きな天気の変化なし。'; }
  else if (change < 3) { trend='上昇中'; desc='天気は回復傾向。'; }
  else { trend='急上昇'; desc='天気が急速に回復。風が強まることも。'; }
  return { change, trend, desc, current: pressures[idx] };
}

function todayWeatherSummary(data) {
  if (!data || !data.daily) return null;
  const d = data.daily;
  return {
    maxT: d.temperature_2m_max?.[0],
    minT: d.temperature_2m_min?.[0],
    precip: d.precipitation_sum?.[0],
    snow: d.snowfall_sum?.[0],
    sunrise: d.sunrise?.[0],
    sunset: d.sunset?.[0],
    windMax: d.wind_speed_10m_max?.[0],
  };
}

function todayHourlySummary(data) {
  if (!data || !data.hourly) return null;
  const h = data.hourly;
  // 今日の0-23時分を抽出
  const slice = (arr) => arr ? arr.slice(0, 24) : [];
  const temps = slice(h.temperature_2m);
  const hum = slice(h.relative_humidity_2m);
  const soilT = slice(h.soil_temperature_0cm);
  const snowD = slice(h.snow_depth);
  const press = slice(h.surface_pressure);
  const avg = (arr) => arr.length > 0 ? arr.reduce((a,b) => a + (b||0), 0) / arr.filter(v => v != null).length : null;
  return {
    avgHumidity: Math.round(avg(hum)),
    soilTemp: Math.round(avg(soilT) * 10) / 10,
    snowDepth: Math.max(...snowD.map(v => v || 0)),
    pressures: press,
    pressure: calcPressureChange(press, 3),
  };
}

// ===== Phase 4: 宇宙天気 =====
let _spaceData = null;

async function fetchSpaceWeather() {
  const endpoints = {
    kIndex:    'https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json',
    solarWind: 'https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json',
    xray:      'https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json',
  };
  const results = {};
  const promises = Object.entries(endpoints).map(async ([key, url]) => {
    try {
      const res = await fetch(url);
      results[key] = await res.json();
    } catch(e) { results[key] = null; }
  });
  await Promise.all(promises);
  return results;
}

function parseSpaceData(raw) {
  const out = { kp: null, solarWind: null, xrayFlux: null };
  // K指数: 配列の最後のエントリ [timestamp, kp, kp_str, ...]
  if (raw.kIndex && Array.isArray(raw.kIndex) && raw.kIndex.length > 1) {
    const last = raw.kIndex[raw.kIndex.length - 1];
    out.kp = parseFloat(last[1]);
    if (isNaN(out.kp)) out.kp = null;
  }
  // 太陽風: plasma配列の最後 [timestamp, density, speed, temperature]
  if (raw.solarWind && Array.isArray(raw.solarWind) && raw.solarWind.length > 1) {
    const last = raw.solarWind[raw.solarWind.length - 1];
    const speed = parseFloat(last[2]);
    out.solarWind = isNaN(speed) ? null : Math.round(speed);
  }
  // X線: 最新のflux
  if (raw.xray && Array.isArray(raw.xray) && raw.xray.length > 0) {
    const last = raw.xray[raw.xray.length - 1];
    out.xrayFlux = last.flux || last.current_flux || null;
  }
  return out;
}

function interpretKIndex(kp) {
  if (kp == null) return { level: '—', desc: 'データを取得できませんでした', farmEffect: '', color: 'var(--text-dim)' };
  if (kp <= 2) return { level: '静穏', desc: '地磁気は穏やか。通常の状態。', farmEffect: '地磁気が安定している日は、植物の根からの養分吸収が正常に行われるとされます。通常の農作業に適した日。', color: 'var(--accent)' };
  if (kp <= 4) return { level: 'やや活発', desc: '地磁気がやや乱れている。', farmEffect: '土壌中の微生物活動に微細な影響がある可能性。種まきや移植は問題ありません。', color: 'var(--warm)' };
  if (kp <= 6) return { level: '活発', desc: '中規模の地磁気嵐が発生中。', farmEffect: '一部の研究では、地磁気嵐時に植物の発芽率に変動が見られるとの報告があります。繊細な作業は可能なら翌日に。', color: 'var(--fire)' };
  return { level: '嵐', desc: '大規模な地磁気嵐。', farmEffect: '強い地磁気嵐は植物の電気的プロセスに影響するという仮説があります。科学的に確立された知見ではありませんが、記録として残します。', color: 'var(--fire)' };
}

function interpretSolarWind(speed) {
  if (speed == null) return { level: '—', desc: 'データを取得できませんでした' };
  if (speed < 350) return { level: '穏やか', desc: `${speed} km/s — 穏やかな状態。` };
  if (speed < 500) return { level: '通常', desc: `${speed} km/s — 通常範囲。` };
  if (speed < 700) return { level: '強い', desc: `${speed} km/s — 太陽風が強まっている。` };
  return { level: '非常に強い', desc: `${speed} km/s — 非常に強い太陽風。大規模な地磁気嵐の可能性。` };
}

async function analyzeLocation(lat, lon) {
  const infoEl = document.getElementById('terrainInfo');
  if (!infoEl) return;

  infoEl.innerHTML = '<div class="terrain-loading">地形情報を取得しています...</div>';

  try {
    const grid = await fetchTerrainProfile(lat, lon);
    const elev = grid.c;

    if (elev === null) {
      infoEl.innerHTML = '<div class="terrain-loading">この地点の標高データがありません（海上や国外の可能性）</div>';
      return;
    }

    const slope = calcSlope(grid);
    const tc = tempCorrection(elev);
    const frost = calcFrostRisk(elev, slope);

    let html = '';
    html += `<div class="row"><span class="label">標高</span><span class="val">${elev.toFixed(0)}m</span></div>`;

    if (tc.diff !== 0) {
      const tcDesc = tc.corr > 0
        ? `平地より約${tc.corr.toFixed(1)}°C暖かい`
        : `平地より約${Math.abs(tc.corr).toFixed(1)}°C涼しい`;
      html += `<div class="row"><span class="label">気温の目安</span><span class="val">${tcDesc}<span style="color:var(--text-dim);font-size:0.8em">（推定）</span></span></div>`;
    }

    if (slope) {
      const slopeDesc = slope.isFlat
        ? '平坦地'
        : `${slope.direction}向き斜面（勾配 ${slope.slopePct}%）`;
      html += `<div class="row"><span class="label">斜面</span><span class="val">${slopeDesc}</span></div>`;
    } else {
      html += `<div class="row"><span class="label">斜面</span><span class="val">計算不可<span style="color:var(--text-dim);font-size:0.8em">（周辺データ不足）</span></span></div>`;
    }

    html += `<p style="font-size:0.75em;color:rgba(139,148,158,0.5);margin-top:6px">標高データ: 国土地理院</p>`;

    infoEl.innerHTML = html;

    // 分析結果を保持（保存ボタン用）
    _currentAnalysis = { lat, lon, elev, slope, frost: frost.score };

    // 保存UIを表示
    const saveUI = document.getElementById('locationSaveUI');
    if (saveUI) saveUI.style.display = 'block';

  } catch(err) {
    infoEl.innerHTML = `<div class="terrain-loading">地形情報の取得に失敗しました。<br><span style="font-size:0.85em">${err.message}</span><br><span style="font-size:0.8em;color:var(--text-dim)">国土地理院APIへの接続を確認してください。CORSブロックの可能性があります。</span></div>`;
  }
}

// ===== 天気データ取得・表示 =====
async function loadWeather(lat, lon) {
  const el = document.getElementById('weatherContent');
  if (!el) return;
  el.innerHTML = '<div class="terrain-loading">気象データを取得しています...</div>';

  try {
    const data = await fetchWeather(lat, lon);
    _weatherData = data;
    const daily = todayWeatherSummary(data);
    const hourly = todayHourlySummary(data);

    if (!daily) { el.innerHTML = '<div class="terrain-loading">気象データの解析に失敗しました</div>'; return; }

    // 太陽データ（astronomy-engine）を天気に統合
    const stNow = sunTimes(new Date());
    let html = '';
    if (stNow) {
      const hh = Math.floor(stNow.min / 60), mmm = stNow.min % 60;
      html += `<div class="row"><span class="label">日出 / 日没</span><span class="val">${fmt(stNow.rise)} / ${fmt(stNow.set)}</span></div>`;
      html += `<div class="row"><span class="label">日照時間</span><span class="val">${hh}時間${mmm}分</span></div>`;
    }
    html += `<div class="row"><span class="label">最高気温 / 最低気温</span><span class="val">${daily.maxT != null ? daily.maxT + '°C' : '—'} / ${daily.minT != null ? daily.minT + '°C' : '—'}</span></div>`;
    html += `<div class="row"><span class="label">降水量</span><span class="val">${daily.precip != null ? daily.precip + 'mm' : '—'}</span></div>`;

    if (daily.snow > 0) {
      html += `<div class="row"><span class="label">降雪量</span><span class="val">${daily.snow}cm</span></div>`;
    }

    if (hourly && hourly.snowDepth > 0) {
      html += `<div class="row"><span class="label">積雪深</span><span class="val">${hourly.snowDepth}cm</span></div>`;
    }

    html += `<div class="row"><span class="label">最大風速</span><span class="val">${daily.windMax != null ? daily.windMax + 'm/s' : '—'}</span></div>`;

    if (hourly) {
      html += `<div class="row"><span class="label">湿度（平均）</span><span class="val">${hourly.avgHumidity}%</span></div>`;

      if (hourly.soilTemp != null) {
        html += `<div class="row"><span class="label">地温（表面）</span><span class="val">${hourly.soilTemp}°C</span></div>`;
      }

      if (hourly.pressure) {
        html += `<div class="row"><span class="label">気圧</span><span class="val">${hourly.pressure.current} hPa</span></div>`;
        html += `<div class="row"><span class="label">気圧変化（3時間）</span><span class="val">${hourly.pressure.change > 0 ? '+' : ''}${hourly.pressure.change} hPa — ${hourly.pressure.trend}</span></div>`;
        html += `<p style="font-size:0.82em;color:var(--text-dim);margin-top:6px">${hourly.pressure.desc}</p>`;
      }
    }

    // 霜リスク（気象統合版）
    if (daily.minT != null && hourly) {
      const windMin = hourly.pressures ? Math.min(...(data.hourly.wind_speed_10m || []).slice(0,6).filter(v => v != null)) : 3;
      const humNight = hourly.avgHumidity;
      const terrainScore = _currentAnalysis ? _currentAnalysis.frost : 50;

      const frostScore = calcEnhancedFrostRisk(daily.minT, humNight, windMin, terrainScore);
      html += `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">`;
      html += `<div class="row"><span class="label">霜リスク（今夜）</span><span class="val" style="color:${frostScore.score >= 70 ? 'var(--fire)' : frostScore.score >= 50 ? 'var(--warm)' : 'var(--accent)'}">${frostScore.level}（${frostScore.score}点）</span></div>`;
      html += `<div class="frost-bar"><div class="frost-bar-fill" style="width:${frostScore.score}%;background:${frostScore.score >= 70 ? 'var(--fire)' : frostScore.score >= 50 ? 'var(--warm)' : 'var(--accent)'}"></div></div>`;
      html += `<p style="font-size:0.82em;color:var(--text-dim);margin-top:6px">${frostScore.desc}</p>`;
      html += `</div>`;
    }

    html += `<p style="font-size:0.72em;color:rgba(139,148,158,0.5);margin-top:8px">データ: Open-Meteo API（気象モデルによる予報値）</p>`;

    el.innerHTML = html;

    // 天気データ取得後に今日の記録を保存
    recordToday();

  } catch(err) {
    el.innerHTML = `<div class="terrain-loading">気象データの取得に失敗しました。<br><span style="font-size:0.85em">${err.message}</span></div>`;
    // 天気が取れなくても天文データだけ記録
    recordToday();
  }
}

// ===== 宇宙天気データ取得（バックグラウンド記録のみ・UIに表示しない） =====
async function loadSpaceWeather() {
  try {
    const raw = await fetchSpaceWeather();
    const data = parseSpaceData(raw);
    _spaceData = data;
    // localStorageに記録（将来の因果解析用）
    try {
      const today = new Date().toISOString().split('T')[0];
      const record = { date: today, kp: data.kp, solarWind: data.solarWind, xrayFlux: data.xrayFlux };
      let history = [];
      try { history = JSON.parse(localStorage.getItem('koyomiban_space_log') || '[]'); } catch(e) {}
      // 同日上書き
      const idx = history.findIndex(r => r.date === today);
      if (idx >= 0) history[idx] = record; else history.push(record);
      // 直近365日分だけ保持
      if (history.length > 365) history = history.slice(-365);
      localStorage.setItem('koyomiban_space_log', JSON.stringify(history));
    } catch(e) {}
  } catch(err) {
    // 取得失敗しても表に出さない。裏の記録なので。
    console.log('宇宙天気データ取得失敗:', err.message);
  }
}

// ===== Phase 5: 観測ログ基盤 =====
const LOG_KEY = 'koyomiban_records';
const LOG_MAX_DAYS = 3650; // 10年分

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch(e) { return []; }
}
function saveRecords(records) {
  try {
    if (records.length > LOG_MAX_DAYS) records = records.slice(-LOG_MAX_DAYS);
    localStorage.setItem(LOG_KEY, JSON.stringify(records));
  } catch(e) { console.log('観測ログ保存失敗:', e.message); }
}

function recordToday() {
  // 天気データと天文データが揃ってから呼ぶ
  const now = new Date();
  const today = now.toISOString().split('T')[0];
  const mz = moonZodiac(now);
  const sl = sunLon(now);
  const sk = find(SEKKI, sl);
  const ko = find(KO72, sl);
  const mp = moonPhase(now);
  const st = sunTimes(now);
  const daily = _weatherData ? todayWeatherSummary(_weatherData) : null;
  const hourly = _weatherData ? todayHourlySummary(_weatherData) : null;

  const record = {
    date: today,
    ts: Math.floor(now.getTime() / 1000),
    loc: { lat: CFG.lat, lon: CFG.lon, alt: _currentAnalysis?.elev || CFG.alt },
    astro: {
      moon_age: Math.round(mp.age * 10) / 10,
      moon_phase: mp.name,
      bd_day: mz.sign.bd,
      sekki_24: sk.name,
      sekki_72: ko.name,
      sunrise: st ? fmt(st.rise) : null,
      sunset: st ? fmt(st.set) : null,
      day_length_min: st ? st.min : null,
    },
    wx: daily ? {
      temp_max: daily.maxT,
      temp_min: daily.minT,
      precip_mm: daily.precip,
      snow_sum: daily.snow,
      wind_max_ms: daily.windMax,
      humidity_avg: hourly?.avgHumidity || null,
      soil_temp: hourly?.soilTemp || null,
      snow_depth_cm: hourly?.snowDepth || null,
      pressure_hpa: hourly?.pressure?.current || null,
      pressure_change_3h: hourly?.pressure?.change || null,
      pressure_trend: hourly?.pressure?.trend || null,
    } : null,
    space: _spaceData ? {
      kp: _spaceData.kp,
      solar_wind_kms: _spaceData.solarWind,
      xray_flux: _spaceData.xrayFlux,
    } : null,
    terrain: _currentAnalysis ? {
      elev: _currentAnalysis.elev,
      slope_dir: _currentAnalysis.slope?.direction || null,
      frost_terrain: _currentAnalysis.frost,
    } : null,
    meta: {
      version: 2,
      sources: [
        'astronomy-engine',
        ...(daily ? ['open-meteo'] : []),
        ...(_spaceData?.kp != null ? ['noaa-swpc'] : []),
        ...(_currentAnalysis ? ['gsi-elevation'] : []),
      ],
    },
  };

  // 保存（同日上書き）
  const records = loadRecords();
  const idx = records.findIndex(r => r.date === today);
  if (idx >= 0) records[idx] = record; else records.push(record);
  saveRecords(records);

  updateLogStatus();
  return record;
}

function updateLogStatus() {
  const el = document.getElementById('logStatus');
  if (!el) return;
  const records = loadRecords();
  if (records.length === 0) {
    el.innerHTML = '<span style="color:var(--text-dim)">まだ記録がありません</span>';
    return;
  }
  const first = records[0].date;
  const last = records[records.length - 1].date;
  const sizeKB = Math.round(JSON.stringify(records).length / 1024);
  el.innerHTML = `${records.length}日分の記録（${first} 〜 ${last}） ${sizeKB}KB`;
}

function exportRecords() {
  const records = loadRecords();
  if (records.length === 0) { alert('エクスポートする記録がありません'); return; }
  const json = JSON.stringify(records, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `koyomiban_records_${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importRecords(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) { alert('無効なデータ形式です'); return; }
      const existing = loadRecords();
      // マージ（同日は新しい方で上書き）
      const merged = [...existing];
      for (const rec of imported) {
        const idx = merged.findIndex(r => r.date === rec.date);
        if (idx >= 0) merged[idx] = rec; else merged.push(rec);
      }
      merged.sort((a, b) => a.date.localeCompare(b.date));
      saveRecords(merged);
      updateLogStatus();
      alert(`${imported.length}件のデータをインポートしました（合計${merged.length}日分）`);
    } catch(err) {
      alert('インポートに失敗しました: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function calcEnhancedFrostRisk(minTemp, humidity, windSpeed, terrainScore) {
  let score = terrainScore || 50;
  if (minTemp <= -5) score += 30;
  else if (minTemp <= 0) score += 20;
  else if (minTemp <= 3) score += 10;
  else if (minTemp <= 5) score += 0;
  else if (minTemp <= 8) score -= 10;
  else score -= 20;
  if (humidity > 80) score -= 5;
  else if (humidity < 50) score += 5;
  if (windSpeed > 5) score -= 10;
  else if (windSpeed > 3) score -= 5;
  else if (windSpeed < 1) score += 8;
  score = Math.max(0, Math.min(100, Math.round(score)));
  let level, desc;
  if (score >= 70) { level='高'; desc='今夜は霜が降りる可能性が高いです。不織布やトンネルで対策を。'; }
  else if (score >= 50) { level='中'; desc='霜の可能性があります。特に明け方の低温に注意。'; }
  else if (score >= 30) { level='やや低'; desc='霜のリスクは低めですが、急な冷え込みには注意。'; }
  else { level='低'; desc='霜の心配はほぼありません。'; }
  return { score, level, desc };
}
